<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOLDANCE - Стиль</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kurale&family=Poppins:wght@400;600;700;800&family=Montserrat:wght@400;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { font-family: 'Montserrat', sans-serif; background-color: #36361B; color: #fff; position: relative; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; width: 100%; position: relative; z-index: 100; }
        .logo-img { height: 50px; width: auto; }
        nav ul { display: flex; list-style: none; gap: 30px; }
        nav ul li a { text-decoration: none; color: #fff; font-size: 20px; font-weight: 400; font-family: 'Kurale', serif; transition: color 0.3s; }
        nav ul li a:hover { color: #FCC402; }
        .header-icons { display: flex; gap: 20px; font-size: 18px; color: #fff; }
        .header-icons i { cursor: pointer; transition: transform 0.2s, color 0.3s; }
        .header-icons i:hover { transform: scale(1.1); color: #FCC402; }

        .star-wrapper { position: fixed; top: 50%; left: 78%; transform: translate(-50%, -50%); width: 160vh; height: 148vh; z-index: 1; pointer-events: none; }
        .star { width: 100%; height: 100%; background-color: #FCC402; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }

        .left-column { position: fixed; left: 50px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 25px; width: 260px; z-index: 10; }
        .video-box { background-color: #000; height: 160px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 28px; font-weight: 700; font-family: 'Poppins', sans-serif; border-radius: 4px; cursor: pointer; transition: transform 0.2s, background 0.3s; }
        .video-box:hover { background-color: #1a1a1a; transform: scale(1.02); }

        .dancer-img { position: fixed; top: 50%; transform: translate(-75%, -45%); width: auto; z-index: 5; pointer-events: none; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.5)); }

        .text-block { position: fixed; top: 50%; left: 68%; transform: translateY(-50%); width: 32vw; max-width: 500px; z-index: 6; color: #111; }
        .text-block h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 5.5vw;
            line-height: 0.9;
            letter-spacing: -3px;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: #111;
        }
        .text-block p { font-family: 'Impact', 'Arial Black', sans-serif; font-size: 15px; line-height: 1.4; margin-bottom: 12px; font-weight: 400; letter-spacing: 0.5px; color: #111; }
        .text-block p b { font-weight: 400; }

        @media (max-width: 1400px) {
            .star-wrapper { width: 130vh; height: 130vh; left: 65%; }
            .text-block h1 { font-size: 110px; }
            .text-block { width: 34vw; left: 62%; }
            .dancer-img { height: 80vh; }
        }
        @media (max-width: 1200px) {
            .star-wrapper { width: 120vh; height: 120vh; left: 68%; }
            .text-block h1 { font-size: 90px; }
            .text-block { width: 34vw; left: 65%; }
            .text-block p { font-size: 13px; }
            .dancer-img { height: 75vh; }
        }
        @media (max-width: 1024px) {
            .left-column { width: 180px; left: 30px; }
            .video-box { height: 120px; font-size: 20px; }
            .star-wrapper { width: 110vh; height: 110vh; left: 72%; }
            .text-block h1 { font-size: 70px; }
            .text-block { width: 36vw; left: 68%; }
            .text-block p { font-size: 11px; }
            .dancer-img { height: 65vh; }
        }
        @media (max-width: 768px) {
            html, body { overflow-y: auto; }
            .star-wrapper { position: relative; top: auto; left: auto; transform: none; width: 120vw; height: 120vw; margin: -20vw auto 0 auto; }
            .left-column { position: relative; top: auto; left: auto; transform: none; width: 90%; margin: 20px auto; flex-direction: row; flex-wrap: wrap; justify-content: center; }
            .video-box { width: 45%; height: 100px; font-size: 16px; }
            .dancer-img { position: relative; top: auto; left: 50% !important; transform: translateX(-50%); height: 50vh !important; margin-top: -100px; display: block; }
            .text-block { position: relative; top: auto; left: auto; transform: none; width: 90%; margin: -20vh auto 40px auto; text-align: left; }
            .text-block h1 { font-size: 60px; text-align: center; margin-left: 0 !important; }
            .text-block p { font-size: 13px; }
        }

        .settings-wrapper { position: relative; display: inline-block; }
        .settings-dropdown {
            display: none; position: absolute; top: 35px; right: -10px;
            background-color: #222; border: 1px solid #FDC201; border-radius: 10px;
            padding: 15px; width: 220px; z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: left;
        }
        .settings-dropdown.show { display: block; animation: fadeInSettings 0.2s ease-out; }
        @keyframes fadeInSettings {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .settings-dropdown h4 {
            color: #FDC201; font-size: 14px; margin-bottom: 5px;
            font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 1px;
        }
        .settings-dropdown select {
            width: 100%; padding: 8px; background-color: #333; color: #fff;
            border: 1px solid #444; border-radius: 5px;
            font-family: 'Montserrat', sans-serif; cursor: pointer; outline: none;
        }
        .settings-dropdown select:focus { border-color: #FDC201; }

        .not-found { position: relative; z-index: 10; padding: 200px 50px; color: #fff; font-family: 'Montserrat', sans-serif; }
        .not-found a { color: #FCC402; }        /* --- Стили для меню (бургер) --- */
        .menu-wrapper {
            position: relative;
            display: inline-block;
        }

        .menu-dropdown {
            display: none; /* Скрыто по умолчанию */
            position: absolute;
            top: 35px;
            right: -10px;
            background-color: #222;
            border: 1px solid #FCC402;
            border-radius: 10px;
            padding: 15px;
            width: 250px;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: left;
            max-height: 80vh; /* Ограничение по высоте */
            overflow-y: auto; /* Скролл, если не влезает */
        }

        .menu-dropdown.show {
            display: block;
            animation: fadeInSettings 0.2s ease-out;
        }

        .menu-dropdown h4 {
            color: #FCC402;
            font-size: 14px;
            margin-bottom: 10px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-link {
            display: block;
            color: #fff;
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 5px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            transition: background 0.3s, color 0.3s;
            margin-bottom: 2px;
        }

        .menu-link:hover {
            background-color: rgba(253, 194, 1, 0.2);
            color: #FCC402;
        }

        .social-link i {
            width: 20px;
            text-align: center;
            margin-right: 8px;
        }

        .menu-divider {
            height: 1px;
            background-color: rgba(255,255,255,0.1);
            margin: 15px 0;
        }

        /* Стилизация скроллбара для меню */
        .menu-dropdown::-webkit-scrollbar {
            width: 6px;
        }
        .menu-dropdown::-webkit-scrollbar-track {
            background: #222;
        }
        .menu-dropdown::-webkit-scrollbar-thumb {
            background: #FCC402;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="GOLDANCE" class="logo-img">
        <nav>
            <ul>
                <li><a href="osnova.html">Главная</a></li>
                <li><a href="style.html">Стили танца</a></li>
                <li><a href="pre.html">Преподаватели</a></li>
                <li><a href="events.html">События</a></li>
                <li><a href="about.html">О нас</a></li>
            </ul>
        </nav>
       <div class="header-icons">
            <a href="help.html" style="color: inherit; text-decoration: none;"><i class="fa-solid fa-envelope"></i></a>
            
            <div class="settings-wrapper">
                <i class="fa-solid fa-gear" id="settingsBtn" onclick="toggleSettings(event)"></i>
                
                <div class="settings-dropdown" id="settingsMenu">
                    <h4><i class="fa-solid fa-globe"></i> Язык</h4>
                    <select id="langSelect" onchange="changeLang()">
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                    </select>

                    <h4 style="margin-top: 15px;"><i class="fa-solid fa-credit-card"></i> Оплата</h4>
                    <select id="paySelect" onchange="changePay()">
                        <option value="card">Банковская карта</option>
                        <option value="sbp">СБП</option>
                        <option value="cash">Наличные</option>
                    </select>
                </div>
            </div>

            <a href="profile.html" style="color: inherit; text-decoration: none;"><i class="fa-regular fa-user"></i></a>
            
            <div class="menu-wrapper">
                <i class="fa-solid fa-bars" id="menuBtn" onclick="toggleMenu(event)"></i>
                
                <div class="menu-dropdown" id="burgerMenu">
                    <h4><i class="fa-solid fa-link"></i> Навигация</h4>
                    <a href="osnova.html" class="menu-link">Главная</a>
                    <a href="style.html" class="menu-link">Стили танца</a>
                    <a href="pre.html" class="menu-link">Преподаватели</a>
                    <a href="events.html" class="menu-link">События</a>
                    <a href="about.html" class="menu-link">О нас</a>

                    <div class="menu-divider"></div>

                    <h4><i class="fa-solid fa-share-nodes"></i> Мы в соцсетях</h4>
                    
                    <a href="https://vk.com/" target="_blank" class="menu-link social-link">
                        <i class="fa-brands fa-vk" style="color: #0077FF;"></i> ВКонтакте
                    </a>
                    <a href="https://t.me/" target="_blank" class="menu-link social-link">
                        <i class="fa-brands fa-telegram" style="color: #229ED9;"></i> Telegram
                    </a>
                    <a href="https://wa.me/" target="_blank" class="menu-link social-link">
                        <i class="fa-brands fa-whatsapp" style="color: #25D366;"></i> WhatsApp
                    </a>
                    <a href="mailto:info@goldance.ru" class="menu-link social-link">
                        <i class="fa-solid fa-envelope" style="color: #FCC402;"></i> info@goldance.ru
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="star-wrapper">
        <div class="star"></div>
    </div>

   

    <!-- Поля заполнит JS -->
    <img id="dancer" src="" alt="Dancer" class="dancer-img">

    <div class="text-block">
        <h1 id="style-name"></h1>
        <div id="style-content"></div>
    </div>

    <script src="styles.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        const s = styles.find(x => x.id === id);

        if (!s) {
            document.body.insertAdjacentHTML('beforeend',
                '<div class="not-found"><h2>Стиль не найден.</h2>' +
                '<p style="margin-top:20px;"><a href="style.html">← Вернуться к списку стилей</a></p></div>');
        } else {
            document.title = "GOLDANCE - " + s.name;

            const dancer = document.getElementById("dancer");
            dancer.src = s.image;
            dancer.alt = s.name + " Dancer";
            dancer.style.left = s.dancerLeft;
            dancer.style.height = s.dancerHeight;

            const h1 = document.getElementById("style-name");
            h1.textContent = s.name;
            h1.style.fontWeight = s.titleWeight;
            h1.style.marginLeft = s.titleShift;

            document.getElementById("style-content").innerHTML = s.content;
        }

        function toggleSettings(event) {
            event.stopPropagation();
            document.getElementById('settingsMenu').classList.toggle('show');
        }
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('settingsMenu');
            const btn = document.getElementById('settingsBtn');
            if (!menu.contains(event.target) && event.target !== btn) {
                menu.classList.remove('show');
            }
        });
        function changeLang() {
            const lang = document.getElementById('langSelect').value;
            localStorage.setItem('userLang', lang);
            alert(lang === 'en' ? 'Language changed to English!' : 'Язык изменен на Русский!');
        }
        function changePay() {
            const pay = document.getElementById('paySelect').value;
            localStorage.setItem('userPay', pay);
            const map = { card: 'Банковская карта', sbp: 'СБП (Система быстрых платежей)', cash: 'Наличные' };
            alert('Способ оплаты изменен на: ' + map[pay]);
        }
        window.onload = function() {
            const savedLang = localStorage.getItem('userLang');
            const savedPay = localStorage.getItem('userPay');
            if (savedLang) document.getElementById('langSelect').value = savedLang;
            if (savedPay) document.getElementById('paySelect').value = savedPay;
        };        // Открытие/закрытие меню (бургер)
        function toggleMenu(event) {
            event.stopPropagation(); 
            const menu = document.getElementById('burgerMenu');
            // Закрываем меню настроек, если оно открыто
            document.getElementById('settingsMenu').classList.remove('show');
            menu.classList.toggle('show');
        }

        // Закрытие меню при клике в любом другом месте
        document.addEventListener('click', function(event) {
            const burgerMenu = document.getElementById('burgerMenu');
            const burgerBtn = document.getElementById('menuBtn');
            
            if (!burgerMenu.contains(event.target) && event.target !== burgerBtn) {
                burgerMenu.classList.remove('show');
            }
        });

        // В функции toggleSettings (для шестерёнки) нужно добавить закрытие меню бургера
        function toggleSettings(event) {
            event.stopPropagation(); 
            const menu = document.getElementById('settingsMenu');
            // Закрываем меню бургера, если оно открыто
            document.getElementById('burgerMenu').classList.remove('show');
            menu.classList.toggle('show');
        }
    </script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // Ищем все иконки пользователя в шапке
        const userIcons = document.querySelectorAll('a[href="vxod.html"]');
        
        // Проверяем, есть ли сохраненный токен (значит, человек вошел)
        const token = localStorage.getItem('token');
        
        if (token) {
            // Если вошел, меняем ссылку у всех иконок на profile.html
            userIcons.forEach(icon => {
                icon.href = 'profile.html';
            });
        }
    });
</script>
<script src="translate.js"></script>

    function toggleMenu(event) { event.stopPropagation(); document.getElementById('settingsMenu').classList.remove('show'); document.getElementById('burgerMenu').classList.toggle('show'); }

        const sm = document.getElementById('settingsMenu'); const sb = document.getElementById('settingsBtn');
